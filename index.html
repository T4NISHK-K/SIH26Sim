<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse Robot Fleet Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>

<body>
  <div id="ui-panel"
    style="position: fixed; top: 16px; left: 16px; z-index: 1000; display: flex; align-items: center; gap: 14px; background: rgba(18, 18, 26, 0.92); backdrop-filter: blur(8px); padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: system-ui, -apple-system, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,0.6); user-select: none;">
    <div style="display: flex; gap: 6px;" id="robot-selector">
      <button class="robot-select-btn" data-robot="Robot-01"
        style="background: #00e5ff; color: #090d16; border: none; font-weight: 700; font-size: 12px; padding: 5px 11px; border-radius: 4px; cursor: pointer; transition: all 0.2s;">Robot-01</button>
      <button class="robot-select-btn" data-robot="Robot-02"
        style="background: #334155; color: #cbd5e1; border: none; font-weight: 700; font-size: 12px; padding: 5px 11px; border-radius: 4px; cursor: pointer; transition: all 0.2s;">Robot-02</button>
      <button class="robot-select-btn" data-robot="Robot-03"
        style="background: #334155; color: #cbd5e1; border: none; font-weight: 700; font-size: 12px; padding: 5px 11px; border-radius: 4px; cursor: pointer; transition: all 0.2s;">Robot-03</button>
    </div>
    <div style="display: flex; flex-direction: column;">
      <span id="active-robot-name" style="font-weight: 700; color: #00e5ff; font-size: 13px;">Robot-01</span>
      <span id="robot-status-text" style="font-size: 11px; color: #94a3b8; font-weight: 500;">Status: <b
          id="status-badge" style="color: #38bdf8;">IDLE</b></span>
    </div>
    <button id="start-btn"
      style="background: #00e5ff; color: #090d16; border: none; font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: all 0.2s;">START</button>
  </div>

  <!-- Fleet Conflict Panel -->
  <div id="conflict-panel"
    style="position: fixed; top: 72px; left: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 5px; background: rgba(18, 18, 26, 0.92); backdrop-filter: blur(8px); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: system-ui, -apple-system, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,0.6); user-select: none; min-width: 240px; max-width: 310px; max-height: 60vh; overflow-y: auto; font-size: 12px;">
    <div style="font-weight: 700; font-size: 10px; letter-spacing: 0.9px; color: #94a3b8; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
      <span>Fleet Conflicts</span>
      <span id="conflict-count-badge"
        style="background: #334155; color: #94a3b8; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; min-width: 20px; text-align: center;">0</span>
    </div>
    <div id="conflict-list">
      <span style="color: #64748b; font-style: italic; font-size: 11px;">No predicted conflicts</span>
    </div>
  </div>

  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
